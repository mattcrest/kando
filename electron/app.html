              </select>
              <button type="button" class="btn btn-primary" id="initiative-epic-add-btn">Add</button>
            </div>
            <div id="initiative-epics-status" class="initiative-epics-status"></div>
          </div>
          <div class="modal-content-area md" id="modal-content"></div>
          <textarea class="modal-content-textarea" id="modal-content-edit" placeholder="Markdown content..." aria-label="Markdown source"></textarea>
        </div>
      </div>
      <aside class="modal-pane modal-pane-props" id="modal-sidebar" aria-label="Properties"></aside>
    </div>
    <div class="modal-footer">
      <div class="modal-footer-left">
        <span class="modal-footer-path" id="modal-path"></span>
        <button type="button" class="modal-copy-path-btn" id="modal-copy-path" title="Copy filename" aria-label="Copy filename to clipboard">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect x="9" y="9" width="13" height="13" rx="2" stroke="currentColor" stroke-width="2"/>
            <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1" stroke="currentColor" stroke-width="2"/>
          </svg>
        </button>
      </div>
      <div class="modal-footer-actions">
        <button class="modal-footer-link" id="modal-open-tolaria" type="button">Open in Tolaria</button>
        <button class="modal-footer-link" id="modal-open-cursor" type="button">Open in Cursor</button>
      </div>
    </div>
  </div>
</div>

<!-- Vault Manager Modal -->
<div class="vault-modal" id="vault-modal">
  <div class="vault-modal-content">
    <div class="vault-modal-header">
      <div class="vault-modal-title">Manage Vaults</div>
      <button class="vault-modal-close" id="vault-modal-close">✕</button>
    </div>
    <div class="vault-modal-body" id="vault-modal-body">
      <div class="vault-list" id="vault-list"></div>
      <button type="button" id="vault-add-toggle" class="vault-add-toggle">+ Add vault</button>
      <div id="vault-add-wrapper" class="vault-add-wrapper">
        <form class="vault-add-form" id="vault-add-form">
          <div class="vault-form-group">
            <label class="vault-form-label">Vault Name</label>
            <input type="text" class="vault-form-input" id="vault-name-input" placeholder="e.g. playerpath" required>
          </div>
          <div class="vault-form-group">
            <label class="vault-form-label">Directory Path</label>
            <input type="text" class="vault-form-input" id="vault-path-input" placeholder="/path/to/vault/Tolaria" required>
          </div>
          <button type="submit" class="vault-form-btn">Add Vault</button>
        </form>
      </div>
    </div>
    <div class="vault-modal-body" id="column-editor" style="display:none">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px">
        <h3 id="column-editor-title" style="margin:0; font-size:16px; font-weight:600"></h3>
        <button class="vault-modal-close" id="column-editor-close" style="width:auto; padding:4px 8px">← Save & Back</button>
      </div>
      <div id="column-list" style="margin-bottom:16px"></div>
      <div style="display:flex; gap:8px">
        <select id="column-add-select" style="flex:1; padding:8px; border:1px solid var(--border-md); border-radius:var(--r-sm); font-family:var(--font)">
          <option value="">Add a column...</option>
        </select>
        <button id="column-add-btn" style="padding:8px 16px; background:var(--accent); color:#fff; border:none; border-radius:var(--r-sm); cursor:pointer; font-weight:500">Add</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ── API Configuration ──────────────────────── */
const API_URL = 'http://localhost:3001';
const VAULT_STORAGE_KEY = 'venubase-kanban-vault';
let currentVault = localStorage.getItem(VAULT_STORAGE_KEY) || 'venubase';
let vaultColors = {}; // Cache vault colors from API

function apiUrl(endpoint) {
  return `${API_URL}${endpoint}?vault=${currentVault}`;
}

/* ── Card URL routing (History API) ───────────── */
let cardUrlPushed = false;

function boardUrl(){
  return `/?vault=${encodeURIComponent(currentVault)}`;
}

function cardUrl(cardId){
  return `/card/${encodeURIComponent(cardId)}?vault=${encodeURIComponent(currentVault)}`;
}

function parseCardRoute(){
  const m = location.pathname.match(/^\/card\/([^/]+)\/?$/);
  if(!m) return null;
  const vault = new URLSearchParams(location.search).get('vault');
  return { cardId: decodeURIComponent(m[1]), vault: vault || null };
}

function initVaultFromUrl(){
  const route = parseCardRoute();
  const vault = route?.vault || new URLSearchParams(location.search).get('vault');
  if(vault){
    currentVault = vault;
    localStorage.setItem(VAULT_STORAGE_KEY, vault);
  }
}

function applyRouteFromHistory(){
  const route = parseCardRoute();
  if(route?.cardId){
    const card = getCard(route.cardId);
    if(card) showModal(route.cardId);
    else {
      history.replaceState({}, '', boardUrl());
      hideModal();
    }
  } else {
    hideModal();
  }
}

function confirmDiscardUnsaved(){
  if(!modalUnsaved) return true;
  if(confirm('You have unsaved changes. Discard them?')){
    modalUnsaved = false;
    document.getElementById('unsaved-dot').classList.remove('visible');
    document.getElementById('modal-save').style.display = 'none';
    return true;
  }
  return false;
}

function navigateToCard(id){
  if(!id || !getCard(id)) return;
  if(id === modalCardId) return;
  if(!confirmDiscardUnsaved()) return;
  history.pushState({ cardId: id, vault: currentVault }, '', cardUrl(id));
  cardUrlPushed = true;
  showModal(id);
}

function dismissModalFromUrl(){
  hideModal();
  modalUnsaved = false;
  history.replaceState({}, '', boardUrl());
  cardUrlPushed = false;
}

window.addEventListener('popstate', () => {
  const route = parseCardRoute();
  if(modalUnsaved && modalCardId && route?.cardId !== modalCardId){
    if(!confirm('You have unsaved changes. Discard them?')){
      history.pushState({ cardId: modalCardId, vault: currentVault }, '', cardUrl(modalCardId));
      return;
    }
    modalUnsaved = false;
    document.getElementById('unsaved-dot').classList.remove('visible');
    document.getElementById('modal-save').style.display = 'none';
  } else if(modalUnsaved && !route?.cardId){
    if(!confirm('You have unsaved changes. Discard them?')){
      history.pushState({ cardId: modalCardId, vault: currentVault }, '', cardUrl(modalCardId));
      return;
    }
    modalUnsaved = false;
    document.getElementById('unsaved-dot').classList.remove('visible');
    document.getElementById('modal-save').style.display = 'none';
  }
  applyRouteFromHistory();
});

/* ── Data Cache (Tolaria content) ──────────── */
const cardContents = {}; // { cardId: markdown content }

/* ── Data helpers ─────────────────────────────── */
const STORAGE_KEY = 'venubase-kanban-v2';
const CARD_TYPE_FILTER_KEY = 'kando-card-type-filter';
const VIEW_MODE_KEY = 'kando-view-mode';
const CARD_TYPES = ['initiative', 'epic', 'slice'];
let SOURCE_META = []; // Will be fetched from API

function loadCardTypeFilter(){
  const raw = localStorage.getItem(CARD_TYPE_FILTER_KEY);
  if(!raw || raw === 'all') return new Set(CARD_TYPES);
  try {
    const arr = JSON.parse(raw);
    if(Array.isArray(arr)){
      const set = new Set(arr.filter(t=>CARD_TYPES.includes(t)));
      return set.size ? set : new Set(CARD_TYPES);
    }
  } catch {}
  // migrate legacy single-value strings ('epic', 'slice', 'initiative')
  return CARD_TYPES.includes(raw) ? new Set([raw]) : new Set(CARD_TYPES);
}
let cardTypeFilter = loadCardTypeFilter();

function saveCardTypeFilter(){
  localStorage.setItem(CARD_TYPE_FILTER_KEY, JSON.stringify([...cardTypeFilter]));
}

function cardType(card){
  if(card.is_initiative) return 'initiative';
  if(card.is_epic) return 'epic';
  return 'slice';
}

function cardTypeFilterLabel(){
  if(cardTypeFilter.size === CARD_TYPES.length) return 'All cards';
  if(cardTypeFilter.size === 0) return 'All cards';
  const names = { initiative:'Initiatives', epic:'Epics', slice:'Slices' };
  return CARD_TYPES.filter(t=>cardTypeFilter.has(t)).map(t=>names[t]).join(' + ');
}
let viewMode = localStorage.getItem(VIEW_MODE_KEY) || 'board';
let initiativeEpicsRows = [];
let initiativeEpicsSaving = false;
let initiativeEpicsDragId = null;

function cardMatchesTypeFilter(card){
  if(cardTypeFilter.size === 0 || cardTypeFilter.size === CARD_TYPES.length) return true;
  return cardTypeFilter.has(cardType(card));
}

function cardTypeBadgeHtml(card){
  if(card.is_initiative){
    const horizon = card.horizon ? ` · ${esc(card.horizon)}` : '';
    return `<span class="card-type-badge card-type-initiative">Initiative${horizon}</span>`;
  }
  if(card.is_epic) return `<span class="card-type-badge card-type-epic">Epic</span>`;
  return `<span class="card-type-badge card-type-slice">Slice</span>`;
}

function cardShellClass(card){
  if(card.is_initiative) return ' card-initiative';
  if(card.is_epic) return ' card-epic';
  return '';
}

const EPICS_SECTION_RE = /^## Epics\r?\n([\s\S]*?)(?=\r?\n## |\r?\n$)/m;

function parseInitiativeEpicsFromContent(content){
  const match = content.match(EPICS_SECTION_RE);
  if(!match) return [];
  const rows = [];
  for(const line of match[1].split(/\r?\n/)){
    if(!/^\|/.test(line) || /^\|[\s\-:|]+\|/.test(line.replace(/\s/g,''))) continue;
    const cells = line.split('|').map(s=>s.trim()).filter((_,i,arr)=>i>0 && i<arr.length-1);
    if(!cells.length) continue;
    const wiki = (cells[0]||'').match(/\[\[([^\]|]+)/);
    if(!wiki) continue;
    rows.push({ id: wiki[1], status: cells[1]||'', notes: cells[2]||'' });
  }
  return rows;
}

function stripEpicsSectionFromMd(md){
  return md.replace(EPICS_SECTION_RE, '').replace(/\n{3,}/g, '\n\n').trimEnd();
}

function setViewMode(mode){
  viewMode = mode === 'strategy' ? 'strategy' : 'board';
  localStorage.setItem(VIEW_MODE_KEY, viewMode);
  document.querySelectorAll('.view-mode-btn').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.view === viewMode);
  });
  document.getElementById('board-wrap')?.classList.toggle('hidden', viewMode === 'strategy');
  document.getElementById('strategy-view')?.classList.toggle('visible', viewMode === 'strategy');
  if(viewMode === 'strategy') renderStrategyView();
  else renderBoard();
}

const HORIZON_ORDER = { 'Now': 0, 'Next': 1, 'Later': 2 };
const HORIZON_META = {
  'Now':   { label: 'Now',   hint: 'Milestone A — Venue #2 ready' },
  'Next':  { label: 'Next',  hint: 'Cohort 2–4 venues' },
  'Later': { label: 'Later', hint: 'Milestone B — scale to 10' },
};

function normalizeHorizon(h){
  if(!h) return 'Later';
  const s = String(h).trim();
  if(/^now/i.test(s)) return 'Now';
  if(/^next/i.test(s)) return 'Next';
  return 'Later';
}

/** Progress across an epic's slices: shipped / total. */
function epicSliceProgress(epicId){
  const slices = state.cards.filter(c=>c.parent === epicId && !c.is_epic && !c.is_initiative);
  const done = slices.filter(c=>c.status === 'Done').length;
  return { done, total: slices.length };
}

function stripInlineMd(text){
  return (text||'')
    .replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g, '$2')
    .replace(/\[\[([^\]]+)\]\]/g, '$1')
    .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
    .replace(/\*\*([^*]+)\*\*/g, '$1')
    .replace(/\*([^*]+)\*/g, '$1')
    .replace(/`([^`]+)`/g, '$1');
}

function renderStrategyEpicRow(row){
  const epic = getCard(row.id);
  const label = epic?.plan_anchor || epic?.title || row.id.replace(/^release-epic-/,'');
  const status = epic?.status || row.status || 'Backlog';
  const { done, total } = epicSliceProgress(row.id);
  const pct = total > 0 ? Math.round(done/total*100) : (status === 'Done' ? 100 : 0);
  return `<button type="button" class="strategy-epic-row" data-card="${esc(row.id)}" title="${esc(epic?.title||row.id)} — ${esc(status)}">
    <span class="strategy-epic-dot" style="${statusDotStyle(status)}"></span>
    <span class="strategy-epic-name">${esc(label)}</span>
    <span class="strategy-epic-progress">
      <span class="strategy-epic-bar"><span class="strategy-epic-fill${status==='Done'?' done':''}" style="width:${pct}%"></span></span>
      <span class="strategy-epic-count">${total > 0 ? `${done}/${total}` : esc(STATUS_LABELS[status]||status)}</span>
    </span>
  </button>`;
}

function renderStrategyView(){
  const root = document.getElementById('strategy-view');
  if(!root) return;
  const initiatives = state.cards.filter(c=>c.is_initiative);

  const lanes = { 'Now': [], 'Next': [], 'Later': [] };
  for(const card of initiatives){
    lanes[normalizeHorizon(card.horizon)].push(card);
  }
  const statusOrder = { Active:0, Prioritized:1, Backlog:2, Blocked:3, Done:4, Deferred:5 };
  for(const key of Object.keys(lanes)){
    lanes[key].sort((a,b)=>(statusOrder[a.status]??9)-(statusOrder[b.status]??9) || (a.title||'').localeCompare(b.title||''));
  }

  let html = '<div class="strategy-lanes">';
  for(const [horizon, cards] of Object.entries(lanes)){
    if(!cards.length) continue;
    const meta = HORIZON_META[horizon];
    html += `<section class="strategy-lane" aria-label="${esc(meta.label)}">
      <header class="strategy-lane-head">
        <span class="strategy-lane-name">${esc(meta.label)}</span>
        <span class="strategy-lane-hint">${esc(meta.hint)}</span>
        <span class="strategy-lane-rule"></span>
      </header>
      ${cards.map(card=>{
        const content = getContent(card.id);
        const summary = stripInlineMd(getSummary(content));
        const epics = parseInitiativeEpicsFromContent(content);
        // roll-up: shipped slices across all child epics
        let rollDone = 0, rollTotal = 0;
        for(const row of epics){
          const p = epicSliceProgress(row.id);
          rollDone += p.done; rollTotal += p.total;
        }
        const rollPct = rollTotal > 0 ? Math.round(rollDone/rollTotal*100) : 0;
        const title = stripInlineMd(card.title||card.id).split('—')[0].trim();
        return `<article class="strategy-row${card.status==='Deferred'?' deferred':''}" data-card="${esc(card.id)}" tabindex="0" role="button">
          <div class="strategy-row-main">
            <div class="strategy-row-titleline">
              <h3 class="strategy-row-title">${esc(title)}</h3>
              <span class="meta-pill" style="${statusStyle(card.status)}">${esc(STATUS_LABELS[card.status]||card.status)}</span>
              ${card.milestone ? `<span class="meta-pill meta-pill-plain">${esc(card.milestone)}</span>` : ''}
            </div>
            <p class="strategy-row-summary">${esc(summary||'No summary yet.')}</p>
            ${rollTotal > 0 ? `<div class="strategy-row-roll">
              <span class="strategy-epic-bar strategy-roll-bar"><span class="strategy-epic-fill" style="width:${rollPct}%"></span></span>
              <span class="strategy-roll-label">${rollDone} of ${rollTotal} slices shipped</span>
            </div>` : ''}
          </div>
          <div class="strategy-row-epics">
            ${epics.length ? epics.map(renderStrategyEpicRow).join('') : '<span class="initiative-epics-hint">No epics linked</span>'}
          </div>
        </article>`;
      }).join('')}
    </section>`;
  }
  html += '</div>';
  root.innerHTML = html;

  root.querySelectorAll('.strategy-row').forEach(el=>{
    el.addEventListener('click', e=>{
      if(e.target.closest('.strategy-epic-row')) return;
      navigateToCard(el.dataset.card);
    });
    el.addEventListener('keydown', e=>{
      if((e.key === 'Enter' || e.key === ' ') && !e.target.closest('.strategy-epic-row')){
        e.preventDefault(); navigateToCard(el.dataset.card);
      }
    });
  });
  root.querySelectorAll('.strategy-epic-row').forEach(el=>{
    el.addEventListener('click', e=>{
      e.stopPropagation();
      navigateToCard(el.dataset.card);
    });
  });
}

function setInitiativeEpicsStatus(msg, isError){
  const el = document.getElementById('initiative-epics-status');
  if(!el) return;
  el.textContent = msg || '';
  el.classList.toggle('error', !!isError);
}

async function saveInitiativeEpics(initiativeId, rows){
  if(initiativeEpicsSaving) return;
  initiativeEpicsSaving = true;
  setInitiativeEpicsStatus('Saving…');
  try {
    const payload = rows.map(row=>{
      const epic = getCard(row.id);
      return {
        id: row.id,
        status: epic?.status || row.status || 'Backlog',
        notes: row.notes || '',
      };
    });
    const resp = await fetch(apiUrl(`/api/initiatives/${encodeURIComponent(initiativeId)}/epics`), {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ rows: payload }),
    });
    if(!resp.ok){
      const err = await resp.json().catch(()=>({}));
      throw new Error(err.error || `Save failed (${resp.status})`);
    }
    const data = await resp.json();
    initiativeEpicsRows = data.rows || payload;
    const content = getContent(initiativeId);
    const without = stripEpicsSectionFromMd(content);
    const tableLines = [
      '## Epics','',
      '| Epic | Status | Notes |',
      '|------|--------|-------|',
      ...initiativeEpicsRows.map(r=>`| [[${r.id}]] | ${r.status} | ${r.notes} |`),
      '',
    ].join('\n');
    const acIdx = without.search(/\r?\n## Initiative acceptance criteria/);
    const merged = acIdx >= 0
      ? `${without.slice(0, acIdx).trimEnd()}\n\n${tableLines}\n${without.slice(acIdx)}`
      : `${without.trimEnd()}\n\n${tableLines}\n`;
    cardContents[initiativeId] = merged;
    setInitiativeEpicsStatus('Saved');
    if(viewMode === 'strategy') renderStrategyView();
    window.setTimeout(()=> setInitiativeEpicsStatus(''), 1500);
  } catch(err){
    console.error(err);
    setInitiativeEpicsStatus(err.message || 'Save failed', true);
  } finally {
    initiativeEpicsSaving = false;
  }
}

function populateInitiativeEpicAddSelect(initiativeId){
  const select = document.getElementById('initiative-epic-add-select');
  if(!select) return;
  const linked = new Set(initiativeEpicsRows.map(r=>r.id));
  const options = state.cards
    .filter(c=>c.is_epic && !c.is_initiative && !linked.has(c.id))
    .sort((a,b)=>(a.title||a.id).localeCompare(b.title||b.id));
  select.innerHTML = `<option value="">Add an epic…</option>${options.map(c=>
    `<option value="${esc(c.id)}">${esc(c.plan_anchor || c.title || c.id)}</option>`
  ).join('')}`;
}

function renderInitiativeEpicsPanel(initiativeId){
  const panel = document.getElementById('initiative-epics-panel');
  const list = document.getElementById('initiative-epics-list');
  if(!panel || !list) return;

  panel.classList.remove('hidden');
  list.innerHTML = initiativeEpicsRows.map((row, idx)=>{
    const epic = getCard(row.id);
    const title = epic?.plan_anchor || epic?.title || row.id;
    const status = epic?.status || row.status || 'Backlog';
    return `<li class="initiative-epic-row" data-epic-id="${esc(row.id)}" data-index="${idx}" draggable="true">
      <span class="initiative-epic-grip" aria-hidden="true">⋮⋮</span>
      <div class="initiative-epic-main">
        <div class="initiative-epic-title">${wikiToCardLink(`[[${row.id}]]`, row.id)}</div>
        <textarea class="initiative-epic-notes" rows="1" data-epic-id="${esc(row.id)}" placeholder="Notes…">${esc(row.notes||'')}</textarea>
      </div>
      <div class="initiative-epic-meta">
        <span class="initiative-epic-status" style="${statusStyle(status)}">${esc(STATUS_LABELS[status]||status)}</span>
      </div>
      <button type="button" class="initiative-epic-remove" data-epic-id="${esc(row.id)}" title="Remove from initiative" aria-label="Remove epic">×</button>
    </li>`;
  }).join('') || `<li class="initiative-epic-row" style="grid-template-columns:1fr"><div class="initiative-epic-main"><div class="initiative-epic-title" style="color:var(--text-3)">No epics yet — add one below.</div></div></li>`;

  populateInitiativeEpicAddSelect(initiativeId);
  bindInitiativeEpicsPanelEvents(initiativeId);
}

function bindInitiativeEpicsPanelEvents(initiativeId){
  const list = document.getElementById('initiative-epics-list');
  if(!list) return;

  list.querySelectorAll('.initiative-epic-row[draggable]').forEach(row=>{
    row.addEventListener('dragstart', e=>{
      initiativeEpicsDragId = row.dataset.epicId;
      e.dataTransfer.effectAllowed = 'move';
      requestAnimationFrame(()=> row.classList.add('dragging'));
    });
    row.addEventListener('dragend', ()=>{
      row.classList.remove('dragging');
      list.querySelectorAll('.initiative-epic-row').forEach(r=>r.classList.remove('drag-over'));
      initiativeEpicsDragId = null;
    });
    row.addEventListener('dragover', e=>{
      e.preventDefault();
      if(!initiativeEpicsDragId || row.dataset.epicId === initiativeEpicsDragId) return;
      row.classList.add('drag-over');
    });
    row.addEventListener('dragleave', ()=> row.classList.remove('drag-over'));
    row.addEventListener('drop', e=>{
      e.preventDefault();
      row.classList.remove('drag-over');
      if(!initiativeEpicsDragId || row.dataset.epicId === initiativeEpicsDragId) return;
      const from = initiativeEpicsRows.findIndex(r=>r.id === initiativeEpicsDragId);
      const to = initiativeEpicsRows.findIndex(r=>r.id === row.dataset.epicId);
      if(from < 0 || to < 0) return;
      const next = [...initiativeEpicsRows];
      const [moved] = next.splice(from, 1);
      next.splice(to, 0, moved);
      initiativeEpicsRows = next;
      renderInitiativeEpicsPanel(initiativeId);
      saveInitiativeEpics(initiativeId, initiativeEpicsRows);
    });
  });

  list.querySelectorAll('.initiative-epic-notes').forEach(input=>{
    input.addEventListener('input', ()=>{
      input.style.height = 'auto';
      input.style.height = `${input.scrollHeight}px`;
    });
    input.style.height = 'auto';
    input.style.height = `${input.scrollHeight}px`;
    input.addEventListener('blur', ()=>{
      const id = input.dataset.epicId;
      const row = initiativeEpicsRows.find(r=>r.id === id);
      if(!row) return;
      row.notes = input.value.trim();
      saveInitiativeEpics(initiativeId, initiativeEpicsRows);
    });
  });

  list.querySelectorAll('.initiative-epic-remove').forEach(btn=>{
    btn.addEventListener('click', e=>{
      e.stopPropagation();
      const id = btn.dataset.epicId;
      if(!confirm('Remove this epic from the initiative? (Epic card is kept; only the link is cleared.)')) return;
      initiativeEpicsRows = initiativeEpicsRows.filter(r=>r.id !== id);
      renderInitiativeEpicsPanel(initiativeId);
      saveInitiativeEpics(initiativeId, initiativeEpicsRows);
    });
  });

  list.querySelectorAll('.card-link').forEach(btn=>{
    btn.addEventListener('click', e=>{
      e.stopPropagation();
      navigateToCard(btn.dataset.card);
    });
  });
}

function hideInitiativeEpicsPanel(){
  document.getElementById('initiative-epics-panel')?.classList.add('hidden');
  document.getElementById('initiative-epics-list').innerHTML = '';
  initiativeEpicsRows = [];
  setInitiativeEpicsStatus('');
}

function getContent(id){
  return cardContents[id] || '';
}

function parseAC(content){
  const lines = content.split('\n');
  const items = [];
  let inAC = false;
  for(const line of lines){
    if(/^## (?:Epic |Initiative )?acceptance criteria/i.test(line)){ inAC=true; continue; }
    if(inAC && /^##\s/.test(line)){ inAC=false; continue; }
    if(inAC){
      const done = line.match(/^- \[x\] (.+)/i);
      const todo = line.match(/^- \[ \] (.+)/);
      if(done) items.push({ text: done[1].trim(), done: true });
      else if(todo) items.push({ text: todo[1].trim(), done: false });
    }
  }
  return items;
}

function parseDeps(content){
  const sec = content.match(/## Dependencies\n([\s\S]*?)(?=\n## |\n---|\n*$)/);
  if(!sec) return [];
  const found = [];
  for(const m of sec[1].matchAll(/\[\[release-([^\]]+)\]\]/g)){
    found.push('release-'+m[1]);
  }
  return found;
}

function parsePRs(content){
  const sec = content.match(/## PRs\n([\s\S]*?)(?=\n## |\n---|\n*$)/);
  if(!sec) return [];
  const urls = [];
  for(const m of sec[1].matchAll(/https:\/\/github\.com\/[^\s\)>\]]+/g)){
    urls.push(m[0]);
  }
  return urls;
}

function countAC(content){
  const items = parseAC(content);
  const done = items.filter(i => i.done).length;
  return { done, total: items.length };
}

function getSummary(content){
  const sec = content.match(/## Summary\n([\s\S]*?)(?=\n## )/);
  if(!sec) return '';
  return sec[1].trim().split('\n').slice(0,2).join(' ').trim();
}

/* ── State ────────────────────────────────────── */
let state = { cards: [], ac: {}, kanbanConfig: null }; // ac: { cardId: { 0: bool, 1: bool, ... } }
let currentKanbanConfig = null;

function buildInitialState(){
  return {
    cards: SOURCE_META.map(m => ({...m})),
    ac: {},
    kanbanConfig: currentKanbanConfig
  };
}

function loadState(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && Array.isArray(parsed.cards)) return parsed;
    }
  } catch(e){}
  return null;
}

function saveState(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){}
}

const INDEX_ORDERED_STATUSES = ['Active', 'Prioritized', 'Backlog'];

function compareCardOrder(a, b) {
  const ao = a.index_order ?? a.roadmap_order ?? Infinity;
  const bo = b.index_order ?? b.roadmap_order ?? Infinity;
  if (ao !== bo) return ao - bo;
  return a.id.localeCompare(b.id);
}

async function persistIndexOrder(affectedStatuses) {
  const sections = {};
  for (const st of affectedStatuses) {
    sections[st] = state.cards
      .filter(c => c.status === st)
      .sort(compareCardOrder)
      .map(c => c.id);
  }
  const resp = await fetch(apiUrl('/api/roadmap-index'), {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ sections })
  });
  if (!resp.ok) throw new Error(await resp.text());
  const data = await resp.json();
  if (data.orders) {
    for (const card of state.cards) {
      const ids = data.orders[card.status];
      card.index_order = ids ? ids.indexOf(card.id) : null;
      if (card.index_order === -1) card.index_order = null;
    }
  }
}

function initState(){
  const saved = loadState();
  state = saved || buildInitialState();
  const metaById = Object.fromEntries(SOURCE_META.map(m => [m.id, m]));
  if(saved){
    const savedIds = new Set(saved.cards.map(c=>c.id));
    for(const m of SOURCE_META){
      if(!savedIds.has(m.id)) state.cards.push({...m});
    }
    // Keep board layout local but refresh status/metadata from vault files
    for(const card of state.cards){
      const meta = metaById[card.id];
      if(!meta) continue;
      card.status = meta.status;
      card.index_order = meta.index_order;
      card.roadmap_order = meta.roadmap_order;
      card.shipped_at = meta.shipped_at;
      card.category = meta.category;
      card.title = meta.title;
      card.plan_anchor = meta.plan_anchor;
      card.is_epic = meta.is_epic === true;
      card.is_initiative = meta.is_initiative === true;
      card.horizon = meta.horizon || null;
      card.milestone = meta.milestone || null;
      card.parent = meta.parent || null;
    }
  }
}

function getCard(id){ return state.cards.find(c=>c.id===id); }

/* ── Board rendering ─────────────────────────── */
const STATUS_LABELS = {
  'Done': 'Shipped',
  'Active': 'Active Queue',
  'Prioritized': 'Prioritized',
  'Backlog': 'Backlog',
  'Blocked': 'Blocked'
};
const STATUS_DOTS = {
  'Done': 'done',
  'Active': 'active',
  'Prioritized': 'active',
  'Backlog': 'backlog',
  'Blocked': 'deferred'
};

function getColumns() {
  if(currentKanbanConfig?.columns) {
    return currentKanbanConfig.columns.map(col => ({
      key: col.key,
      label: col.label || STATUS_LABELS[col.key] || col.key,
      dot: STATUS_DOTS[col.key] || 'backlog'
    }));
  }
  const statuses = new Set(state.cards.map(c => c.status));
  const statusOrder = ['Done', 'Active', 'Prioritized', 'Backlog', 'Blocked'];
  const ordered = statusOrder.filter(s => statuses.has(s));
  return ordered.map(key => ({
    key,
    label: STATUS_LABELS[key] || key,
    dot: STATUS_DOTS[key] || 'backlog'
  }));
}

function cardPosition(card) {
  const cols = getColumns();
  const orderedCol = cols.find(c => c.key === card.status);
  if(!orderedCol) return null;
  const ordered = state.cards.filter(c => c.status === card.status).sort(compareCardOrder);
  return ordered.findIndex(c => c.id === card.id) + 1;
}

function formatDate(d){
  if(!d) return '';
  const dt = new Date(d);
  return dt.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}

function renderCard(card, position){
  const content = getContent(card.id);
  const {done:acDone, total:acTotal} = countAC(content);
  const deps = parseDeps(content);
  const prs = parsePRs(content);
  const pct = acTotal > 0 ? Math.round(acDone/acTotal*100) : 0;
  const summary = getSummary(content);

  let bottom = '';
  const typeBadge = cardTypeBadgeHtml(card);
  const tag = card.category
    ? `<span class="card-tag" style="${catStyle(card.category)}">${esc(card.category)}</span>`
    : '';

  if(card.status === 'Done'){
    const pr = prs[0];
    const prNum = pr ? pr.match(/\/pull\/(\d+)/)?.[1] : null;
    bottom = `
      <div class="card-footer">
        <div>${tag}</div>
        <div>
          <span class="card-shipped">Shipped ${formatDate(card.shipped_at)}</span>
          ${prNum ? `<a class="card-pr" href="${pr}" target="_blank" rel="noopener">PR #${prNum}</a>` : ''}
        </div>
      </div>`;
  } else if(acTotal > 0){
    bottom = `
      <div class="card-footer">
        <div>${tag}</div>
        <div class="card-progress">
          <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
          <span class="card-progress-label">${acDone}/${acTotal}</span>
        </div>
        ${deps.length>0 ? `<span class="card-deps">${deps.length} dep${deps.length>1?'s':''}</span>` : ''}
      </div>`;
  } else if(deps.length > 0){
    bottom = `
      <div class="card-footer">
        <div>${tag}</div>
        <span class="card-deps">${deps.length} dep${deps.length>1?'s':''}</span>
      </div>`;
  } else {
    bottom = `<div class="card-footer"><div>${tag}</div></div>`;
  }

  return `<div class="card${cardShellClass(card)}" data-card="${card.id}" data-is-epic="${card.is_epic ? '1' : '0'}" data-is-initiative="${card.is_initiative ? '1' : '0'}" draggable="true">
    <div class="card-top">
      ${position ? `<div class="card-order">${position}</div>` : ''}
      <div class="card-title">${esc(card.title)}</div>
      ${typeBadge}
    </div>
    ${summary ? `<div class="card-summary">${renderInline(summary)}</div>` : ''}
    ${bottom}
  </div>`;
}

function renderBoard(){
  const board = document.getElementById('board');
  const cols = getColumns();
  let html = '';
  for(const col of cols){
    let cards = state.cards.filter(c=>c.status===col.key && cardMatchesTypeFilter(c));
    if(col.key==='Done') cards.sort((a,b)=>new Date(b.shipped_at||0)-new Date(a.shipped_at||0));
    else cards.sort(compareCardOrder);

    const showPosition = col.key === 'Active' || col.key === 'Prioritized';
    const cardsHtml = cards.length
      ? cards.map((c,i)=>renderCard(c, showPosition ? i+1 : null)).join('')
      : `<div class="col-empty"><span style="font-size:18px;opacity:.3">${col.key==='Done'?'✓':'○'}</span><span>No items</span></div>`;

    const isCollapsed = JSON.parse(localStorage.getItem('COLLAPSED_COLS')||'{}')[col.key];
    html += `<div class="column${isCollapsed?' collapsed':''}" data-col="${col.key}">
      <div class="col-head">
        <div class="col-dot ${col.dot}"></div>
        <span class="col-name">${col.label}</span>
        <span class="col-count">${cards.length}</span>
        <span class="col-toggle" data-col="${col.key}">${isCollapsed?'▶':'◀'}</span>
      </div>
      <div class="col-body" data-col="${col.key}" id="col-${col.key}">${cardsHtml}</div>
    </div>`;
  }
  board.innerHTML = html;
  bindCardEvents();
  bindColumnEvents();
  bindDragEvents();
}

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function cardIdFromWiki(inner){
  const slug = (inner || '').trim().split('|')[0].trim();
  if(!slug) return '';
  return slug.startsWith('release-') ? slug : `release-${slug}`;
}

function cardLinkLabel(id, display){
  if(display) return display;
  const card = getCard(id);
  if(card) return card.title.replace(/^(Shipped: |release-)/i,'').substring(0, 40);
  return id.replace(/^release-/,'').replace(/-/g, ' ');
}

function wikiToCardLink(_match, inner){
  const pipe = inner.indexOf('|');
  const slugPart = (pipe >= 0 ? inner.slice(0, pipe) : inner).trim();
  const display = pipe >= 0 ? inner.slice(pipe + 1).trim() : '';
  const id = cardIdFromWiki(slugPart);
  const label = cardLinkLabel(id, display);
  const title = getCard(id)?.title || id;
  const missing = !getCard(id);
  return `<button type="button" class="card-link${missing ? ' card-link-missing' : ''}" data-card="${esc(id)}" title="${esc(title)}"${missing ? ' disabled' : ''}>${esc(label)}</button>`;
}

function linkifyWikiPlaceholders(text){
  const links = [];
  const stripped = (text || '').replace(/\[\[([^\]]+)\]\]/g, (m, inner) => {
    const i = links.length;
    links.push(wikiToCardLink(m, inner));
    return `\x00WIKI${i}\x00`;
  });
  return { stripped, links };
}

function restoreWikiPlaceholders(html, links){
  return html.replace(/\x00WIKI(\d+)\x00/g, (_, i) => links[+i] || '');
}

function renderInline(s){
  const { stripped, links } = linkifyWikiPlaceholders(s);
  return restoreWikiPlaceholders(
    esc(stripped)
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/`(.+?)`/g, '<code style="font-size:12px;background:var(--bg);border:1px solid var(--border);border-radius:3px;padding:1px 4px">$1</code>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>'),
    links
  );
}

/* ── Drag & drop ─────────────────────────────── */
let drag = null;

function bindDragEvents(){
  document.querySelectorAll('.card').forEach(el=>{
    el.addEventListener('dragstart', e=>{
      drag = el.dataset.card;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', drag);
      requestAnimationFrame(()=>el.classList.add('dragging'));
    });
    el.addEventListener('dragend', ()=>{
      document.querySelectorAll('.card.dragging').forEach(c=>c.classList.remove('dragging'));
      document.querySelectorAll('.drop-indicator').forEach(d=>d.remove());
      document.querySelectorAll('.col-body.drag-over').forEach(c=>c.classList.remove('drag-over'));
      drag = null;
    });
  });

  document.querySelectorAll('.col-body').forEach(col=>{
    col.addEventListener('dragover', e=>{
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      col.classList.add('drag-over');

      col.querySelectorAll('.drop-indicator').forEach(d=>d.remove());
      const cards = [...col.querySelectorAll('.card:not(.dragging)')];
      let insertBefore = null;
      for(const c of cards){
        const rect = c.getBoundingClientRect();
        if(e.clientY < rect.top + rect.height/2){ insertBefore=c; break; }
      }
      const ind = document.createElement('div');
      ind.className = 'drop-indicator';
      insertBefore ? col.insertBefore(ind, insertBefore) : col.appendChild(ind);
    });

    col.addEventListener('dragleave', e=>{
      if(!col.contains(e.relatedTarget)){
        col.classList.remove('drag-over');
        col.querySelectorAll('.drop-indicator').forEach(d=>d.remove());
      }
    });

    col.addEventListener('drop', e=>{
      e.preventDefault();
      col.classList.remove('drag-over');
      col.querySelectorAll('.drop-indicator').forEach(d=>d.remove());
      if(!drag) return;

      const newStatus = col.dataset.col;
      const card = getCard(drag);
      if(!card) return;

      // Calculate target index from DOM
      const domCards = [...col.querySelectorAll('.card:not(.dragging)')];
      let insertIdx = domCards.length;
      for(let i=0;i<domCards.length;i++){
        const rect = domCards[i].getBoundingClientRect();
        if(e.clientY < rect.top + rect.height/2){ insertIdx=i; break; }
      }

      moveCard(drag, newStatus, domCards.map(c=>c.dataset.card), insertIdx);
    });
  });
}

async function moveCard(cardId, newStatus, siblingIds, insertIdx){
  const card = getCard(cardId);
  if(!card) return;
  const oldStatus = card.status;
  card.status = newStatus;

  const newOrder = [...siblingIds];
  newOrder.splice(insertIdx, 0, cardId);
  newOrder.forEach((id, i) => {
    const c = getCard(id);
    if (c) c.index_order = i;
  });

  if(newStatus === 'Done'){
    if(!card.shipped_at) card.shipped_at = new Date().toISOString().split('T')[0];
  }

  saveState();

  try {
    const updates = {
      status: card.status,
      shipped_at: card.shipped_at || null,
    };
    if (oldStatus === 'Active' && newStatus !== 'Active') {
      updates.roadmap_order = null;
      card.roadmap_order = null;
    }
    await fetch(apiUrl(`/api/cards/${cardId}`), {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(updates)
    });

    const affected = new Set();
    if (INDEX_ORDERED_STATUSES.includes(newStatus)) affected.add(newStatus);
    if (INDEX_ORDERED_STATUSES.includes(oldStatus)) affected.add(oldStatus);
    if (affected.size) await persistIndexOrder([...affected]);
  } catch(err){
    console.error('Failed to save card move:', err);
  }

  refreshGitStatus();

  renderBoard();

  if(newStatus !== oldStatus){
    showToast(newStatus === 'Done' ? 'Marked as shipped ✓' : `Moved to ${newStatus}`);
  }

  if(modalCardId === cardId) showModal(cardId);
}

/* ── Card click → open modal ─────────────────── */
let modalCardId = null;
let modalUnsaved = false;
let contentEdited = false;

function bindCardEvents(){
  document.querySelectorAll('.card').forEach(el=>{
    el.addEventListener('click', ()=>navigateToCard(el.dataset.card));
  });
}

function bindColumnEvents(){
  document.querySelectorAll('.col-toggle').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      const colKey = el.dataset.col;
      const collapsed = JSON.parse(localStorage.getItem('COLLAPSED_COLS')||'{}');
      collapsed[colKey] = !collapsed[colKey];
      localStorage.setItem('COLLAPSED_COLS', JSON.stringify(collapsed));
      renderBoard();
    });
  });
}

/* ── Modal ───────────────────────────────────── */
function visibleCards(){
  return state.cards.filter(cardMatchesTypeFilter);
}

function showModal(id){
  modalCardId = id;
  modalUnsaved = false;
  const card = getCard(id);
  if(!card) return;

  const content = getContent(id);
  const deps = parseDeps(content);
  const prs = parsePRs(content);
  const modalEl = document.getElementById('modal');

  // Title
  const titleEl = document.getElementById('modal-title');
  titleEl.value = card.title;
  titleEl.style.height = 'auto';
  titleEl.style.height = titleEl.scrollHeight + 'px';

  // Properties + body
  renderSidebar(card, deps, prs);
  renderModalBreadcrumb(card);
  renderModalHeaderMeta(card);

  let contentForMd = content.replace(/^## (?:Epic |Initiative )?acceptance criteria[\s\S]*?(?=^## |\Z)/im, '');
  if(card.is_initiative){
    modalEl.classList.add('modal-initiative');
    initiativeEpicsRows = parseInitiativeEpicsFromContent(content);
    renderInitiativeEpicsPanel(id);
    contentForMd = stripEpicsSectionFromMd(contentForMd);
    document.getElementById('initiative-epic-add-btn').onclick = ()=>{
      const select = document.getElementById('initiative-epic-add-select');
      const epicId = select?.value;
      if(!epicId) return;
      initiativeEpicsRows = [...initiativeEpicsRows, { id: epicId, status: getCard(epicId)?.status || 'Backlog', notes: '' }];
      renderInitiativeEpicsPanel(id);
      saveInitiativeEpics(id, initiativeEpicsRows);
    };
  } else {
    modalEl.classList.remove('modal-initiative');
    hideInitiativeEpicsPanel();
  }

  document.getElementById('modal-content').innerHTML = renderMd(contentForMd);

  document.getElementById('modal-path').textContent = card.path;

  // Nav buttons
  const all = visibleCards();
  const idx = all.findIndex(c=>c.id===id);
  document.getElementById('modal-prev').disabled = idx <= 0;
  document.getElementById('modal-next').disabled = idx >= all.length-1;

  // Reset content edit mode
  document.getElementById('modal-content').classList.remove('edit-hidden');
  document.getElementById('modal-content-edit').classList.remove('edit-active');
  const toggleBtn = document.getElementById('modal-content-toggle');
  toggleBtn.textContent = 'Edit';
  toggleBtn.classList.remove('editing');
  contentEdited = false;

  // Unsaved indicator
  document.getElementById('unsaved-dot').classList.remove('visible');
  document.getElementById('modal-save').style.display = 'none';

  // Show
  document.getElementById('overlay').classList.add('open');
  document.getElementById('modal-content-scroll').scrollTop = 0;
}

/* Breadcrumb: Initiative → Epic → Slice, parents clickable */
function cardCrumbLabel(card){
  const label = card.plan_anchor || card.title || card.id;
  return label.length > 44 ? label.slice(0, 42).trimEnd() + '…' : label;
}

function ancestorChain(card){
  const chain = [];
  let cur = card;
  const seen = new Set([card.id]);
  while(cur?.parent && !seen.has(cur.parent)){
    const parent = getCard(cur.parent);
    if(!parent) break;
    chain.unshift(parent);
    seen.add(parent.id);
    cur = parent;
  }
  return chain;
}

function renderModalBreadcrumb(card){
  const nav = document.getElementById('modal-breadcrumb');
  if(!nav) return;
  const parents = ancestorChain(card);
  const parts = parents.map(p =>
    `<button type="button" class="modal-breadcrumb-item" data-card="${esc(p.id)}" title="${esc(p.title||p.id)}">${esc(cardCrumbLabel(p))}</button><span class="modal-breadcrumb-sep">›</span>`
  );
  parts.push(`<span class="modal-breadcrumb-current" title="${esc(card.title||card.id)}">${esc(cardCrumbLabel(card))}</span>`);
  nav.innerHTML = parts.join('');
  nav.querySelectorAll('.modal-breadcrumb-item').forEach(btn=>{
    btn.addEventListener('click', ()=> navigateToCard(btn.dataset.card));
  });
}

/* Header meta strip: type, status, horizon/category at a glance */
function renderModalHeaderMeta(card){
  const el = document.getElementById('modal-header-meta');
  if(!el) return;
  const pills = [cardTypeBadgeHtml(card)];
  pills.push(`<span class="meta-pill" style="${statusStyle(card.status)}">${esc(STATUS_LABELS[card.status]||card.status)}</span>`);
  if(card.category) pills.push(`<span class="meta-pill" style="${catStyle(card.category)}">${esc(card.category)}</span>`);
  if(card.is_initiative && card.milestone) pills.push(`<span class="meta-pill meta-pill-plain">${esc(card.milestone)}</span>`);
  if(card.shipped_at) pills.push(`<span class="meta-pill meta-pill-plain">Shipped ${esc(formatDate(card.shipped_at))}</span>`);
  const {done:acDone, total:acTotal} = countAC(getContent(card.id));
  if(acTotal > 0) pills.push(`<span class="meta-pill meta-pill-plain">✓ ${acDone}/${acTotal} criteria</span>`);
  el.innerHTML = pills.join('');
}

function renderAcGroupHtml(card){
  const content = getContent(card.id);
  const acItems = parseAC(content);
  const acState = state.ac[card.id] || {};
  if(!acItems.length) return '';

  const doneCount = acItems.filter((item,i)=> item.done || acState[i]).length;
  const pct = Math.round(doneCount / acItems.length * 100);
  return `<div class="prop-group prop-group-ac" aria-label="Acceptance criteria">
    <div class="prop-ac-header">
      <span class="prop-group-label">Acceptance criteria</span>
      <span class="prop-ac-count">${doneCount} of ${acItems.length}</span>
    </div>
    <div class="prop-ac-bar"><div class="prop-ac-fill" style="width:${pct}%"></div></div>
    <div class="modal-ac-list">
      ${acItems.map((item,i)=>{
        const checked = item.done || !!acState[i];
        return `<div class="ac-item${checked?' checked':''}" data-ac-idx="${i}" data-card-id="${card.id}">
          <div class="ac-box">
            <svg class="ac-check-svg" viewBox="0 0 10 8"><polyline points="1,4 4,7 9,1"/></svg>
          </div>
          <span class="ac-text">${renderInline(item.text)}</span>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

function propRow(label, valueHtml){
  return `<div class="prop-row"><span class="prop-label">${label}</span><div class="prop-value">${valueHtml}</div></div>`;
}

function childCards(card){
  let kids = [];
  if(card.is_initiative) kids = state.cards.filter(c=>c.parent === card.id && c.is_epic);
  else if(card.is_epic) kids = state.cards.filter(c=>c.parent === card.id && !c.is_epic && !c.is_initiative);
  const order = { Active:0, Prioritized:1, Backlog:2, Blocked:3, Deferred:4, Done:5 };
  return kids.sort((a,b)=>{
    const d = (order[a.status] ?? 9) - (order[b.status] ?? 9);
    return d !== 0 ? d : (a.title||a.id).localeCompare(b.title||b.id);
  });
}

function renderSidebar(card, deps, prs){
  const cols = getColumns();
  let html = `<div class="prop-group">`;
  html += propRow('Status', `<select class="prop-select" id="modal-status" data-dynamic>${cols.map(col => `<option value="${col.key}">${col.label}</option>`).join('')}</select>`);
  html += propRow('Category', `<input class="prop-input" id="modal-category" value="${esc(card.category||'')}" placeholder="Add category">`);
  if(card.is_initiative && card.horizon){
    html += propRow('Horizon', `<span class="prop-value">${esc(card.horizon)}</span>`);
  }
  if(card.is_initiative && card.milestone){
    html += propRow('Milestone', `<span class="prop-value-muted">${esc(card.milestone)}</span>`);
  }
  if(card.parent && getCard(card.parent)){
    const parent = getCard(card.parent);
    html += propRow(parent.is_initiative ? 'Initiative' : 'Epic',
      `<span class="dep-chip" data-dep="${esc(parent.id)}" title="${esc(parent.title)}">${esc(cardCrumbLabel(parent))}</span>`);
  }
  if (INDEX_ORDERED_STATUSES.includes(card.status)) {
    const pos = card.index_order != null ? card.index_order + 1 : null;
    html += propRow('Queue', pos
      ? `<span class="prop-value-muted">#${pos} in roadmap-index.md</span>`
      : `<span class="prop-value-muted">Not in index</span>`);
  }
  if(card.shipped_at){
    html += propRow('Shipped', `<span class="prop-value">${formatDate(card.shipped_at)}</span>`);
  }
  html += `</div>`;
  html += renderAcGroupHtml(card);

  const children = childCards(card);
  if(children.length > 0 && !card.is_initiative){
    const doneKids = children.filter(c=>c.status === 'Done').length;
    html += `<div class="prop-group">
      <div class="prop-ac-header">
        <span class="prop-group-label">Story slices</span>
        <span class="prop-ac-count">${doneKids} of ${children.length} shipped</span>
      </div>
      <div class="sidebar-children">${children.map(c=>
        `<button type="button" class="sidebar-child" data-dep="${esc(c.id)}" title="${esc(c.title)} — ${esc(c.status)}">
          <span class="sidebar-child-dot" style="${statusDotStyle(c.status)}"></span>
          <span class="sidebar-child-label">${esc(cardCrumbLabel(c))}</span>
        </button>`
      ).join('')}</div>
    </div>`;
  }

  if(deps.length > 0){
    html += `<div class="prop-group"><div class="prop-group-label">Dependencies</div><div class="prop-tags">${deps.map(depId=>{
      const depCard = getCard(depId);
      const label = depCard ? depCard.title.replace(/^(Shipped: |release-)/i,'').substring(0,36) : depId.replace('release-','');
      return `<span class="dep-chip" data-dep="${depId}" title="${depCard?depCard.title:depId}">${esc(label)}</span>`;
    }).join('')}</div></div>`;
  }

  if(prs.length || !card.is_initiative){
    html += `<div class="prop-group"><div class="prop-group-label">Pull requests</div><div class="prop-value">${prs.length
      ? prs.map(url=>{
          const num = url.match(/\/pull\/(\d+)/)?.[1];
          return `<a class="prop-link" href="${url}" target="_blank" rel="noopener">PR #${num||'link'}</a>`;
        }).join('<br>')
      : '<span class="prop-empty">None yet</span>'
    }</div></div>`;
  }

  document.getElementById('modal-sidebar').innerHTML = html;

  const sel = document.getElementById('modal-status');
  if(sel){
    sel.value = card.status;
    sel.style = statusStyle(card.status);
  }

  bindSidebarInputs();
  bindDepChips();
  bindAcItems();
}

async function saveModalChanges(){
  if(!modalCardId) return;
  const card = getCard(modalCardId);
  if(!card) return;

  // Title
  const newTitle = document.getElementById('modal-title').value.trim();
  if(newTitle) card.title = newTitle;

  // Status
  const newStatus = document.getElementById('modal-status').value;
  const oldStatus = card.status;
  if(newStatus !== oldStatus){
    if(newStatus === 'Done' && !card.shipped_at) card.shipped_at = new Date().toISOString().split('T')[0];
    card.status = newStatus;
    if (INDEX_ORDERED_STATUSES.includes(newStatus)) {
      const inColumn = state.cards.filter(c => c.status === newStatus && c.id !== modalCardId);
      card.index_order = inColumn.length;
    }
    if (oldStatus === 'Active' && newStatus !== 'Active') {
      card.roadmap_order = null;
    }
  }

  // Category
  const catInput = document.getElementById('modal-category');
  if(catInput) card.category = catInput.value.trim();

  saveState();

  // Persist frontmatter to API
  try {
    const updates = {
      status: card.status,
      shipped_at: card.shipped_at || null,
      plan_anchor: card.title,
      category: card.category || null,
    };
    if (oldStatus === 'Active' && card.status !== 'Active') {
      updates.roadmap_order = null;
    }
    await fetch(apiUrl(`/api/cards/${modalCardId}`), {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(updates)
    });

    const affected = new Set();
    if (INDEX_ORDERED_STATUSES.includes(card.status)) affected.add(card.status);
    if (INDEX_ORDERED_STATUSES.includes(oldStatus)) affected.add(oldStatus);
    if (affected.size) await persistIndexOrder([...affected]);
  } catch(err){
    console.error('Failed to save card to API:', err);
  }

  // Persist content to API if edited
  if(contentEdited){
    const rawContent = document.getElementById('modal-content-edit').value;
    try {
      await fetch(apiUrl(`/api/cards/${modalCardId}/content`), {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content: rawContent })
      });
      cardContents[modalCardId] = rawContent;
      contentEdited = false;
      // Refresh rendered preview
      const contentForMd = rawContent.replace(/^## (?:Epic |Initiative )?acceptance criteria[\s\S]*?(?=^## |\Z)/im, '');
      document.getElementById('modal-content').innerHTML = renderMd(contentForMd);
    } catch(err){
      console.error('Failed to save card content to API:', err);
    }
  }

  modalUnsaved = false;
  document.getElementById('unsaved-dot').classList.remove('visible');
  document.getElementById('modal-save').style.display = 'none';
  renderBoard();
  showToast('Saved');
  refreshGitStatus();
}

async function openInCursor(cardId){
  const card = getCard(cardId);
  if(!card) return;

  const content = getContent(cardId);
  const summary = getSummary(content);
  const prompt = `Let's plan our approach to building this: ${summary}\n\n${content}`;

  try {
    // Try to spawn Cursor with the card file
    const resp = await fetch(`${API_URL}/api/cursor/open`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        cardId: card.id,
        cardPath: card.path,
        vault: currentVault
      })
    });

    if(resp.ok){
      showToast('Opening in Cursor...');
      return;
    }
  } catch(err){
    console.log('Cursor spawn failed, falling back to clipboard:', err);
  }

  // Fallback: copy to clipboard
  try {
    await navigator.clipboard.writeText(prompt);
    showToast('Prompt copied to clipboard. Paste in Cursor to continue.');
  } catch(err){
    console.error('Failed to copy to clipboard:', err);
    alert('Could not open Cursor or copy to clipboard. Please check that Cursor is installed.');
  }
}

function getEffectiveTheme(preference){
  if(preference === 'system'){
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  return preference;
}

function applyTheme(preference){
  const effective = getEffectiveTheme(preference);
  document.documentElement.setAttribute('data-theme', effective);
}

function setThemePreference(preference){
  localStorage.setItem('theme-preference', preference);
  applyTheme(preference);
  updateThemeMenu(preference);
  closeThemeMenu();
}

  const options = document.querySelectorAll('.theme-option');
  options.forEach(opt => {
    if(opt.getAttribute('data-theme') === preference){
      opt.classList.add('active');
    } else {
      opt.classList.remove('active');
    }
  });
}

function filterCards(query){
  const q = query.toLowerCase().trim();
  const cards = document.querySelectorAll('.card');
  let visible = 0;
  cards.forEach(card=>{
    const title = card.querySelector('.card-title')?.textContent || '';
    const summary = card.querySelector('.card-summary')?.textContent || '';
    const tags = card.querySelector('.card-tag')?.textContent || '';
    const typeOk = cardMatchesTypeFilter({
      is_epic: card.dataset.isEpic === '1',
      is_initiative: card.dataset.isInitiative === '1',
    });
    const matches = typeOk && (q === '' ||
      title.toLowerCase().includes(q) ||
      summary.toLowerCase().includes(q) ||
      tags.toLowerCase().includes(q));
    card.style.display = matches ? '' : 'none';
    if(matches) visible++;
  });
}

const STATUS_COLORS = {
  'Active': { bg:'#eeeeff', text:'#5b5bd6' },
  'Prioritized': { bg:'#e0e7ff', text:'#4338ca' },
  'Backlog': { bg:'#fef9ee', text:'#b45309' },
  'Blocked': { bg:'#fee2e2', text:'#991b1b' },

function renderMd(md){
  function inlineFormat(text){
    const { stripped, links } = linkifyWikiPlaceholders(text);
    const formatted = stripped
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*([^*]+)\*/g, '<em>$1</em>')
      .replace(/_([^_]+)_/g, '<em>$1</em>');
    return restoreWikiPlaceholders(formatted, links);
  }

  const lines = md.split('\n');
  const out = [];
  let i = 0;

  while(i < lines.length){
    const line = lines[i];

    // Headings
    if(/^### /.test(line)){ out.push(`<h3>${inlineFormat(line.slice(4))}</h3>`); i++; continue; }
    if(/^## /.test(line)){ out.push(`<h2>${inlineFormat(line.slice(3))}</h2>`); i++; continue; }
    if(/^# /.test(line)){ out.push(`<h1>${inlineFormat(line.slice(2))}</h1>`); i++; continue; }

    // Unordered list block
    if(/^[-*] /.test(line)){
      out.push('<ul>');
      while(i < lines.length && /^[-*] /.test(lines[i])){
        const item = lines[i].slice(2);
        if(/^\[( |x)\] /i.test(item)){
          const checked = item[1].toLowerCase() === 'x';
          out.push(`<li class="task-item"><input type="checkbox" disabled ${checked ? 'checked' : ''}> ${inlineFormat(item.slice(4))}</li>`);
        } else {
          out.push(`<li>${inlineFormat(item)}</li>`);
        }
        i++;
      }
      out.push('</ul>');
      continue;
    }

    // Ordered list block
    if(/^\d+\. /.test(line)){
      out.push('<ol>');
      while(i < lines.length && /^\d+\. /.test(lines[i])){
        const item = lines[i].replace(/^\d+\. /, '');
        out.push(`<li>${inlineFormat(item)}</li>`);
        i++;
      }
      out.push('</ol>');
      continue;
    }

    // Markdown table block
    if(/^\|.+\|$/.test(line.trim()) && i + 1 < lines.length && /^\|[\s\-:|]+\|$/.test(lines[i + 1].trim())){
      const tableLines = [];
      while(i < lines.length && /^\|.+\|$/.test(lines[i].trim())){
        tableLines.push(lines[i].trim());
        i++;
      }
      if(tableLines.length >= 2){
        const headerCells = tableLines[0].split('|').map(c=>c.trim()).filter((_,idx,arr)=>idx>0 && idx<arr.length-1);
        const bodyRows = tableLines.slice(2);
        let tableHtml = '<table><thead><tr>';
        for(const cell of headerCells) tableHtml += `<th>${inlineFormat(cell)}</th>`;
        tableHtml += '</tr></thead><tbody>';
        for(const rowLine of bodyRows){
          const cells = rowLine.split('|').map(c=>c.trim()).filter((_,idx,arr)=>idx>0 && idx<arr.length-1);
          if(!cells.length) continue;
          tableHtml += '<tr>';
          for(const cell of cells) tableHtml += `<td>${inlineFormat(cell)}</td>`;
          tableHtml += '</tr>';
        }
        tableHtml += '</tbody></table>';
        out.push(tableHtml);
        continue;
      }
      i -= tableLines.length;
    }

    // Blank line
    if(line.trim() === ''){ i++; continue; }

    // Paragraph: accumulate consecutive non-block lines
    const para = [];
    while(i < lines.length && lines[i].trim() !== '' && !/^#{1,6} /.test(lines[i]) && !/^[-*] /.test(lines[i]) && !/^\d+\. /.test(lines[i])){
      para.push(inlineFormat(lines[i]));
      i++;
    }
    if(para.length) out.push(`<p>${para.join('<br>')}</p>`);
    else i++; // safety: skip unrecognised line to prevent infinite loop
  }

  return out.join('\n');
}

/* ── Boot ────────────────────────────────────── */
async function loadCards(){
  try {
    // Fetch kanban config for current vault
    const vaultsResp = await fetch(`${API_URL}/api/vaults`);
    if(vaultsResp.ok) {
      const { vaults } = await vaultsResp.json();
      const vault = vaults.find(v => v.key === currentVault || v.name.toLowerCase() === currentVault.toLowerCase());
      if(vault?.kanban) {
        currentKanbanConfig = vault.kanban;
      }
    }

    const resp = await fetch(apiUrl('/api/cards'));
    if(!resp.ok) throw new Error(`API error: ${resp.status}`);
    SOURCE_META = await resp.json();

    // Fetch content for each card
    for(const card of SOURCE_META){
      try {
        const contentResp = await fetch(apiUrl(`/api/cards/${card.id}`));
        if(contentResp.ok){
          const cardData = await contentResp.json();
          cardContents[card.id] = cardData.content;
        }
      } catch(err){
        console.error(`Failed to fetch content for ${card.id}:`, err);
      }
    }

    initState();
    setViewMode(viewMode);

    const route = parseCardRoute();
    if(route?.cardId){
      if(getCard(route.cardId)) showModal(route.cardId);
      else history.replaceState({}, '', boardUrl());
    }
  } catch(err){
    console.error('Failed to load cards from API:', err);
    alert('Failed to load kanban data. Is the API server running on localhost:3001?');
  }
}

async function initializeVaultSelector(){
  try {
    const resp = await fetch(`${API_URL}/api/vaults`);
    if(!resp.ok) throw new Error('Failed to fetch vaults');
    const { vaults } = await resp.json();

    // Cache vault colors
    for(const vault of vaults){
      vaultColors[vault.name.toLowerCase()] = vault.color;
    }

    const switcher = document.getElementById('vault-switcher');
    const menu = document.getElementById('vault-switcher-menu');
    const btn = document.getElementById('vault-switcher-btn');
    const nameSpan = document.getElementById('vault-switcher-name');
    const logo = document.getElementById('logo');

    // Update logo with current vault
    const currentVaultObj = vaults.find(v => v.key === currentVault);
    const currentVaultName = currentVaultObj?.name || currentVault;
    if(logo) {
      logo.textContent = currentVaultName.charAt(0).toUpperCase();
      updateLogoColor(currentVaultName);
    }

    // Hide switcher if only 1 vault
    if(vaults.length <= 1){
      switcher.classList.add('hidden');
      return;
    }
    switcher.classList.remove('hidden');

    // Update button text with current vault
    const displayName = currentVaultName.charAt(0).toUpperCase() + currentVaultName.slice(1);
    nameSpan.textContent = displayName;

    // Populate menu
    menu.innerHTML = '';
    for(const vault of vaults){
      const vaultName = String(vault.name || '');
      const item = document.createElement('div');
      item.className = 'vault-switcher-item';
      if(vault.key === currentVault){
        item.classList.add('active');
      }
      item.innerHTML = `<span>${vaultName}</span>`;
      item.addEventListener('click', ()=>switchVault(vault.key, vaultName));
      menu.appendChild(item);
    }

    // Add Manage Vaults option
    const manageItem = document.createElement('div');
    manageItem.className = 'vault-switcher-item manage-vaults';
    manageItem.innerHTML = '<span>Manage Vaults</span>';
    manageItem.addEventListener('click', function(){
      const menu = document.getElementById('vault-switcher-menu');
      if(menu) menu.classList.remove('open');
      setTimeout(() => openVaultModal(), 0);
    });
    menu.appendChild(manageItem);
  } catch(err){
    console.error('Failed to initialize vault selector:', err);
  }
}

function switchVault(vaultKey, vaultName){
  if(vaultKey !== currentVault){
    currentVault = vaultKey;
    currentKanbanConfig = null;
    localStorage.setItem(VAULT_STORAGE_KEY, vaultKey);
    localStorage.removeItem(STORAGE_KEY);
    Object.keys(cardContents).forEach(key => delete cardContents[key]);
    state = {};
    dismissModalFromUrl();
    closeVaultMenu();
    // Update switcher button text and menu
    const nameSpan = document.getElementById('vault-switcher-name');
    if(nameSpan) nameSpan.textContent = vaultName;
    // Update logo
    const logo = document.getElementById('logo');
    if(logo) {
      logo.textContent = vaultName.charAt(0).toUpperCase();
      updateLogoColor(vaultName);
    }
    // Update menu item active states
    const items = document.querySelectorAll('.vault-switcher-item');
    items.forEach(item => {
      if(item.querySelector('span').textContent === vaultName){
        item.classList.add('active');
      } else {
        item.classList.remove('active');
      }
    });
    showToast(`Switched to ${vaultName}`);
    loadCards();
    refreshGitStatus();
  }
}

async function updateVaultList(){

        </div>
      `;

    }

    // Add event listeners to color pickers
    document.querySelectorAll('.vault-item-color-input').forEach(input => {
      input.addEventListener('input', (e) => {

        const newColor = e.target.value;

      });

    document.querySelectorAll('.vault-item-color-swatch').forEach(swatch => {

function enterEditMode(item){

  const pathEl = item.querySelector('.vault-item-path');

async function updateVault(oldName, newName, newPath){
  try {
    const resp = await fetch(`${API_URL}/api/vaults/${oldName}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: newName, path: newPath })
    });
    if(!resp.ok){
      const err = await resp.json();
      throw new Error(err.error || 'Failed to update vault');
    }
    // If currently active vault was renamed, update currentVault
    if(oldName.toLowerCase() === currentVault.toLowerCase()){
      currentVault = newName.toLowerCase();
      localStorage.setItem(VAULT_STORAGE_KEY, currentVault);
    }
    await initializeVaultSelector();
    updateVaultList();
    showToast(`Updated vault "${newName}"`);
  } catch(err){
    console.error('Failed to update vault:', err);
    alert(`Error updating vault: ${err.message}`);
    updateVaultList();
  }
}

async function removeVault(name){
  try {
    const resp = await fetch(apiUrl(`/api/vaults/${name}`), { method: 'DELETE' });
    if(!resp.ok) throw new Error('Failed to remove vault');
    await initializeVaultSelector();

    showToast(`Removed vault "${name}"`);

let editingVault = null;

function openColumnEditor(vault) {
  editingVault = vault;
  const body = document.getElementById('vault-modal-body');
  const editor = document.getElementById('column-editor');
  const title = document.getElementById('column-editor-title');
  const columnList = document.getElementById('column-list');
  const addSelect = document.getElementById('column-add-select');

  title.textContent = `Columns: ${vault.name}`;
  body.style.display = 'none';
  editor.style.display = 'block';

  // Populate available statuses
  const allStatuses = ['Backlog', 'Active', 'Prioritized', 'Done', 'Blocked'];
  const usedStatuses = new Set(vault.kanban.columns.map(c => c.key));
  const available = allStatuses.filter(s => !usedStatuses.has(s));

  addSelect.innerHTML = '<option value="">Add a column...</option>';
  for (const status of available) {
    const opt = document.createElement('option');
    opt.value = status;
    opt.textContent = status;
    addSelect.appendChild(opt);
  }

  // Render columns
  columnList.innerHTML = vault.kanban.columns.map((col, idx) => `
    <div class="col-row" data-index="${idx}">
      <div class="col-row-body">
        <span class="col-row-handle">⋮⋮</span>
        <div class="col-row-key">${col.key}</div>
        <input type="text" value="${col.label}" class="col-row-label" placeholder="Label" data-label="${idx}">
      </div>
      <button type="button" class="col-row-remove" data-remove="${idx}" title="Remove column"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg></button>
    </div>
  `).join('');

  // Add event listeners
  columnList.querySelectorAll('input[data-label]').forEach(input => {
    input.addEventListener('change', () => {
      const idx = parseInt(input.getAttribute('data-label'));
      editingVault.kanban.columns[idx].label = input.value;
    });
  });

  columnList.querySelectorAll('button[data-remove]').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.getAttribute('data-remove'));
      editingVault.kanban.columns.splice(idx, 1);
      openColumnEditor(editingVault);
    });
  });

  // Drag to reorder
  let draggedEl = null;
  columnList.querySelectorAll('div[data-index]').forEach(el => {
    el.draggable = true;
    el.addEventListener('dragstart', () => { draggedEl = el; });
    el.addEventListener('dragover', (e) => {
      e.preventDefault();
      const idx = parseInt(el.getAttribute('data-index'));
      const dragIdx = parseInt(draggedEl.getAttribute('data-index'));
      if (idx !== dragIdx) {
        const col = editingVault.kanban.columns.splice(dragIdx, 1)[0];
        editingVault.kanban.columns.splice(idx, 0, col);
        openColumnEditor(editingVault);
      }
    });
  });

  addSelect.addEventListener('change', () => {
    if(addSelect.value) {
      editingVault.kanban.columns.push({ key: addSelect.value, label: addSelect.value });
      openColumnEditor(editingVault);
    }
  });

  document.getElementById('column-editor-close').addEventListener('click', closeColumnEditor);
}

/* ── Vault git sync ──────────────────────────── */
let gitSyncInFlight = false;
let gitSyncButtonDefault = 'Commit & Push';

function applyGitUiState({ label, dot, btn, wrap, pill, statusText, btnText, state }) {
  wrap.classList.remove('hidden');
  label.textContent = statusText;
  pill.title = statusText;

  label.classList.remove('synced', 'needs-sync');
  dot.classList.remove('synced', 'needs-sync');
  btn.classList.remove('needs-sync', 'synced-state', 'syncing');

  if (state === 'synced') {
    label.classList.add('synced');
    dot.classList.add('synced');
    btn.classList.add('synced-state');
    btn.textContent = btnText;
    btn.disabled = true;
  } else {
    label.classList.add('needs-sync');
    dot.classList.add('needs-sync');
    btn.classList.add('needs-sync');
    btn.textContent = btnText;
    btn.disabled = gitSyncInFlight;
  }
}

function describeGitStatus(status) {
  const branch = status.branch || 'main';
  const remote = status.upstream || `origin/${branch}`;

  if (status.syncedWithRemote) {
    return {
      state: 'synced',
      statusText: `Up to date with ${remote}`,
      btnText: 'Synced with main',
    };
  }

  const parts = [];
  if (!status.clean) {
    const n = status.changed.length;
    parts.push(n === 1 ? '1 uncommitted change' : `${n} uncommitted changes`);
  }
  if (status.behind > 0) {
    parts.push(`${status.behind} commit(s) behind ${remote}`);
  }
  if (status.ahead > 0) {
    parts.push(`${status.ahead} commit(s) to push`);
  }

  let btnText = 'Commit & Push';
  if (!status.clean && status.behind > 0) btnText = 'Pull, Commit & Push';
  else if (!status.clean) btnText = 'Commit & Push';
  else if (status.behind > 0 && status.ahead > 0) btnText = 'Pull & Push';
  else if (status.behind > 0) btnText = 'Pull from main';
  else if (status.ahead > 0) btnText = 'Push to main';

  return {
    state: 'needs-sync',
    statusText: parts.join(' · ') || 'Sync needed',
    btnText,
  };
}

async function refreshGitStatus(){
  const wrap = document.getElementById('git-sync-wrap');
  const pill = document.getElementById('git-sync-pill');
  const label = document.getElementById('git-status-label');
  const dot = document.getElementById('git-status-dot');
  const btn = document.getElementById('git-sync-btn');
  if(!wrap || !pill || !label || !dot || !btn) return;

  try {
    const resp = await fetch(`${API_URL}/api/vaults/${currentVault}/git/status`);
    if(!resp.ok) {
      wrap.classList.add('hidden');
      return;
    }
    const status = await resp.json();
    if(!status.isRepo){
      wrap.classList.add('hidden');
      return;
    }

    const ui = describeGitStatus(status);
    applyGitUiState({ label, dot, btn, wrap, pill, ...ui });
    if (ui.state === 'needs-sync') {
      gitSyncButtonDefault = ui.btnText;
    }
  } catch(err){
    console.error('Git status check failed:', err);
    wrap.classList.add('hidden');
  }
}

async function syncVaultGit(){
  if(gitSyncInFlight) return;
  const btn = document.getElementById('git-sync-btn');
  const wrap = document.getElementById('git-sync-wrap');
  const pill = document.getElementById('git-sync-pill');
  const label = document.getElementById('git-status-label');
  const dot = document.getElementById('git-status-dot');
  gitSyncInFlight = true;
  if(btn){
    btn.disabled = true;
    btn.classList.add('syncing');
    btn.textContent = 'Syncing…';
  }

  try {
    const resp = await fetch(`${API_URL}/api/vaults/${currentVault}/git/sync`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ push: true })
    });
    const data = await resp.json();
    if(!resp.ok) throw new Error(data.error || 'Sync failed');

    if (data.status && wrap && pill && label && dot && btn) {
      const ui = describeGitStatus(data.status);
      applyGitUiState({ label, dot, btn, wrap, pill, ...ui });
    }

    if (data.pulled) {
      await loadCards();
    }

    if (data.committed && data.pushed) {
      showToast('Committed & pushed ✓');
    } else if (data.committed) {
      showToast('Committed ✓');
    } else if (data.pushed) {
      showToast('Pushed to main ✓');
    } else if (data.pulled) {
      showToast('Pulled from main ✓');
    } else if (data.status?.syncedWithRemote) {
      showToast('Up to date with main');
    } else {
      showToast('Sync complete');
    }
  } catch(err){
    console.error('Git sync failed:', err);
    alert(`Git sync failed: ${err.message}`);
  } finally {
    gitSyncInFlight = false;
    if(btn){
      btn.classList.remove('syncing');
    }
    refreshGitStatus();
  }
}

document.getElementById('git-sync-btn')?.addEventListener('click', syncVaultGit);

initVaultFromUrl();
initializeVaultSelector();
loadCards();
refreshGitStatus();
setInterval(refreshGitStatus, 30000);
</script>
